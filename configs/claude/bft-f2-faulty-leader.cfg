\* Full-featureset check of BFTSMaRtTotalOrder on the bft-f2-faulty-leader setup.
\* Same constants as configs/bft-f2-faulty-leader.cfg (SmartBFT parity); adds the
\* multi-instance safety invariants and Values symmetry.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).
\*
\* NOTE: Termination is intentionally NOT asserted here. The model has no view
\* change, and a faulty leader's ByzantineSend is not in FairSpec, so a fair run
\* exists where it never proposes and nothing decides -- liveness cannot hold.
\* Safety (Agreement etc.) must still hold under the Byzantine leader.
\* With no temporal property checked, SYMMETRY is fully sound here (pure safety).

SPECIFICATION FairSpec

CONSTANTS
    Replicas = {1,2,3,4,5,6,7}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 2
    Faulty = {4,5}
    Leader = 4
    NoValue = NoValue

SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    AcceptImpliesWrite
    OrderedDelivery
    DecisionMatchesAccept
    CertificateUniqueness
    TotalOrder
    PrefixGapFree

\* PROPERTIES
\*     Termination   \* see header: cannot hold with a Byzantine leader, no view change
