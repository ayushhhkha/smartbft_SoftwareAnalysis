\* Full-featureset check of BFTSMaRtTotalOrder on the bft-f1-no-faults setup.
\* Same constants as configs/bft-f1-no-faults.cfg (SmartBFT parity); adds the
\* multi-instance safety invariants, Values symmetry, and liveness.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).

SPECIFICATION FairSpec

CONSTANTS
    Replicas = {1,2,3,4}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 1
    Faulty = {}
    Leader = 1
    NoValue = NoValue

