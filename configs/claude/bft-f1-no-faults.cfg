\* Safety check of ClaudeSmartBFT on the bft-f1-no-faults setup.
\* Same constants as configs/bft-f1-no-faults.cfg (SmartBFT parity). Safety only,
\* mirroring the non-claude configs (INIT/NEXT + invariants) with Values symmetry.
\* No liveness property -- see the project notes for the separate liveness check.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).

INIT Init
NEXT Next

CONSTANTS
    Replicas = {1,2,3,4}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 1
    Faulty = {}
    Leader = 1
    NoValue = NoValue

\* Permutations(Values); sound for safety-only checking.
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    AcceptImpliesWrite
    OrderedDelivery
    DecisionMatchesAccept
    CertificateUniqueness
    TotalOrder
    PrefixGapFree
