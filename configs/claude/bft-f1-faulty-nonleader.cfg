\* Full-featureset check of BFTSMaRtTotalOrder on the bft-f1-faulty-nonleader setup.
\* Same constants as configs/bft-f1-faulty-nonleader.cfg (SmartBFT parity); adds the
\* multi-instance safety invariants, Values symmetry, and liveness.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).
\* Leader is correct and the 3 correct replicas form a quorum, so liveness holds
\* despite the faulty non-leader.

SPECIFICATION FairSpec

CONSTANTS
    Replicas = {1,2,3,4}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 1
    Faulty = {4}
    Leader = 1
    NoValue = NoValue

\* Permutations(Values); safe here because the asserted liveness genuinely holds.
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    AcceptImpliesWrite
    OrderedDelivery
    DecisionMatchesAccept
    CertificateUniqueness
    TotalOrder
    PrefixGapFree

PROPERTIES
    Termination
