\* Safety check of ClaudeSmartBFT on the bft-f1-faulty-leader setup.
\* Same constants as configs/bft-f1-faulty-leader.cfg (SmartBFT parity). Safety only,
\* mirroring the non-claude configs (INIT/NEXT + invariants) with Values symmetry.
\* Safety (Agreement etc.) must hold even with the Byzantine leader.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).

INIT Init
NEXT Next

CONSTANTS
    Replicas = {1,2,3,4}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 1
    Faulty = {1}
    Leader = 1
    NoValue = NoValue

\* Permutations(Values); sound for safety-only checking.
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    AcceptImpliesWrite
    OrderedDelivery
    DecisionMatchesAccept
    CertificateUniqueness
    TotalOrder
    PrefixGapFree
