\* Full-featureset check of BFTSMaRtTotalOrder on the bft-f2-faulty-nonleaders setup.
\* Same constants as configs/bft-f2-faulty-nonleaders.cfg (SmartBFT parity); adds the
\* multi-instance safety invariants, Values symmetry, and liveness.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).
\* Leader is correct and the 5 correct replicas form a quorum (>(7+2)/2 = >=5),
\* so liveness holds despite the two faulty non-leaders.

SPECIFICATION FairSpec

CONSTANTS
    Replicas = {1,2,3,4,5,6,7}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 2
    Faulty = {4,5}
    Leader = 1
    NoValue = NoValue

\* Permutations(Values); safe here because the asserted liveness genuinely holds.
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    AcceptImpliesWrite
    OrderedDelivery
    DecisionMatchesAccept
    CertificateUniqueness
    TotalOrder
    PrefixGapFree

PROPERTIES
    Termination
