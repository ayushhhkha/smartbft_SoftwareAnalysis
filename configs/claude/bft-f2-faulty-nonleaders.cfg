\* Safety check of ClaudeSmartBFT on the bft-f2-faulty-nonleaders setup.
\* Same constants as configs/bft-f2-faulty-nonleaders.cfg (SmartBFT parity). Safety
\* only, mirroring the non-claude configs (INIT/NEXT + invariants) with Values
\* symmetry. No liveness property -- see the project notes for the separate check.
\* Run against ClaudeSmartBFT.tla (NOT SmartBFT.tla).

INIT Init
NEXT Next

CONSTANTS
    Replicas = {1,2,3,4,5,6,7}
    Values = {v1, v2}
    MaxConsensus = 2
    F = 2
    Faulty = {4,5}
    Leader = 1
    NoValue = NoValue

\* Permutations(Values); sound for safety-only checking.
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    Agreement
    Validity
    Integrity
    AcceptImpliesWrite
    OrderedDelivery
    DecisionMatchesAccept
    CertificateUniqueness
    TotalOrder
    PrefixGapFree
