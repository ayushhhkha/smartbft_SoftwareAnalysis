\* Liveness: all replicas correct, synchronous; every correct replica
\* eventually decides. Uses FairSpec for fairness.
CONSTANTS
    Replicas  = {0, 1, 2, 3}
    Byzantine = {}
    Leader    = 0
    Values    = {v1}
    F         = 1
    NoVal     = NoVal
SPECIFICATION FairSpec
PROPERTY Termination
