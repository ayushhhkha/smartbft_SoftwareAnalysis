\* Multi-instance total-order safety: n=4, f=1, one faulty replica,
\* correct leader, 2 consensus instances (cid 1..2).
\* Uses the shared SmartBFT input interface.
CONSTANTS
    Replicas     = {1, 2, 3, 4}
    Values       = {v1, v2}
    F            = 1
    Faulty       = {4}
    Leader       = 1
    NoValue      = NoValue
    MaxConsensus = 2

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT Agreement
INVARIANT Validity
INVARIANT Integrity
INVARIANT AcceptImpliesWrite
INVARIANT OrderedDelivery
INVARIANT CertificateUniqueness
INVARIANT TotalOrder
INVARIANT PrefixGapFree

SYMMETRY Symmetry
